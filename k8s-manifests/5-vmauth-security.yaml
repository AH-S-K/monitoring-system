apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: admin-user
  namespace: monitoring-system
spec:
  username: admin
  passwordRef:
    name: monitoring-secrets
    key: VM_ADMIN_PASSWORD
  targetRefs:
    - static:
        url: "http://alert-viewer.monitoring-system.svc.cluster.local:8080"
      paths: ["^/alert.*"]
    - crd:
        kind: VMSingle
        name: vm-backend
        namespace: monitoring-system
      paths: ["/api/v1/.*", "/vmui.*", "/prometheus/.*", "^/$"]
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: vmauth-gateway
  namespace: monitoring-system
spec:
  replicaCount: 1
  selectAllByDefault: true
  resources:
    requests:
      cpu: "20m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"